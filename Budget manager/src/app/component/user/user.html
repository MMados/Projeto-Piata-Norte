<div *ngIf="userData$ | async as userData">
 
<details class="dropdown">

  <summary class="dropdown__header">
    <span class="dropdown__name">{{ userData.nome }}</span>
    <svg class="dropdown__chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </summary>

  <div class="dropdown__body">
    <dl class="dropdown__data">
      <div class="field">
        <dt>Nome</dt>
        <dd>{{ userData.nome || 'Sem nome' }}</dd>
      </div>
      <div class="field">
        <dt>E-mail</dt>
        <dd>{{ userData.email }}</dd>
      </div>
    </dl>

    <div class="dropdown__footer">
      <button type="button" class="logout" (click)="logout()"> Sair da conta </button>
    </div>
  </div>

</details>
  
</div>
